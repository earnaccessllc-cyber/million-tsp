workflows:
  ios-release:
    name: MillionFed iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: MillionTSP ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.earnaccessllc.milliontsp
      vars:
        APP_ID: 6805869337
        APP_VERSION: 1.2
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1))
      - name: Build IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration

  android-release:
    name: MillionFed Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - MillionFED Distribution
      vars:
        PACKAGE_NAME: com.earnaccessllc.milliontsp
      node: 22
      java: 17
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
