<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2240"/>
      <stop offset="100%" style="stop-color:#0a0e20"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE566"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C9A832;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C9A832;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Glow -->
  <ellipse cx="32" cy="32" rx="28" ry="28" fill="url(#glow)"/>
  <!-- Shield border -->
  <path d="M32 4 L58 14 L58 34 C58 48 46 58 32 62 C18 58 6 48 6 34 L6 14 Z" fill="url(#borderGrad)"/>
  <!-- Shield body -->
  <path d="M32 7 L55 16 L55 34 C55 46.5 44.5 56 32 59.5 C19.5 56 9 46.5 9 34 L9 16 Z" fill="url(#shieldGrad)"/>
  <!-- Bar 1 (short) -->
  <rect x="17" y="36" width="6" height="10" rx="1" fill="url(#barGrad)"/>
  <!-- Bar 2 (medium) -->
  <rect x="26" y="28" width="6" height="18" rx="1" fill="url(#barGrad)"/>
  <!-- Bar 3 (tall) -->
  <rect x="35" y="20" width="6" height="26" rx="1" fill="url(#barGrad)"/>
  <!-- Arrow line -->
  <line x1="16" y1="44" x2="44" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polyline points="36,16 44,18 42,26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>